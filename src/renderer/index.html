<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Yomi</title>
    <script>
      try {
        document.documentElement.classList.add(localStorage.getItem('yomi-theme') === 'light' ? 'light' : 'dark')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: mr-img:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
