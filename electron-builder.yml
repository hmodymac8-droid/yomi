appId: com.yomi.reader
productName: Yomi
copyright: Yomi
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!docs/**'
  - '!.claude/**'
  - '!.github/**'
  - '!*.zip'
asarUnpack:
  - resources/**
win:
  executableName: Yomi
  icon: build/icon.ico
  target:
    # one installer for every Windows PC: it installs the right version for the computer (Intel/AMD or ARM)
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  artifactName: Yomi-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  shortcutName: Yomi
  uninstallDisplayName: Yomi
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
linux:
  target:
    - AppImage
  maintainer: Yomi
  category: Utility
appImage:
  artifactName: Yomi-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: hmodymac8-droid
  repo: yomi
  releaseType: release
